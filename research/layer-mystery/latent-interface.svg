<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 14 422 348" width="422" height="348" role="img" aria-labelledby="lmTitle lmDesc" preserveAspectRatio="xMidYMid meet">
  <title id="lmTitle">Where to cut the latent interface of a VLA policy</title>
  <desc id="lmDesc">A frozen vision-language backbone drawn as a stack of layers. The latent interface is tapped at layer 15, which scores 76.3 percent success, and feeds an action head that outputs an action. The deepest layer, 28, is crossed out: it is what most policies read from, and it scores only 62.9 percent.</desc>

  <style>
    .lbl   { font: 14px Arial, Helvetica, sans-serif; fill: #333; }
    .small { font: 12px Arial, Helvetica, sans-serif; fill: #666; }
    .tiny  { font: 11px Arial, Helvetica, sans-serif; fill: #888; }
    .head  { font: bold 14px Arial, Helvetica, sans-serif; fill: #333; }
    .mono  { font: 13px "SF Mono", Menlo, Consolas, monospace; fill: #0a66c2; }
  </style>

  <rect x="20" y="14" width="422" height="348" fill="#fafafa"/>

  <text x="34" y="34" class="head">Where do you cut the backbone?</text>

  <!-- backbone: 14 stacked bars, L28 at top down to L1 at bottom -->
  <g>
    <rect x="34" y="56" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="76" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="96" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="116" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="136" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="156" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <!-- the tapped layer -->
    <rect x="34" y="176" width="120" height="16" rx="3" fill="#0a66c2" stroke="#094f96"/>
    <rect x="34" y="196" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="216" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="236" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="256" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="276" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="296" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
    <rect x="34" y="316" width="120" height="16" rx="3" fill="#e6e8ea" stroke="#cdd2d6"/>
  </g>
  <text x="94" y="350" class="small" text-anchor="middle">frozen VLM backbone</text>

  <!-- deepest-layer annotation -->
  <text x="182" y="61" class="small">L28 &#183; deepest</text>
  <text x="182" y="76" class="tiny">62.9% &#8212; what most policies use</text>
  <g stroke="#b0b6bb" stroke-width="1.8" stroke-linecap="round">
    <line x1="162" y1="59" x2="172" y2="69"/>
    <line x1="172" y1="59" x2="162" y2="69"/>
  </g>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a66c2"/>
    </marker>
    <marker id="arwGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- tap arrow from the selected layer -->
  <path d="M154,184 L232,184" stroke="#0a66c2" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <text x="164" y="177" class="small" fill="#0a66c2">L15 &#183; 76.3%</text>

  <!-- latent interface -> action head -> action -->
  <rect x="244" y="152" width="184" height="64" rx="6" fill="#eef2f6" stroke="#0a66c2"/>
  <text x="336" y="176" class="lbl" text-anchor="middle" fill="#0a66c2">latent interface</text>
  <text x="336" y="196" class="mono" text-anchor="middle">Z = &#966;(X)</text>

  <path d="M336,216 L336,250" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arwGrey)"/>
  <rect x="264" y="256" width="144" height="40" rx="6" fill="#fff" stroke="#cdd2d6"/>
  <text x="336" y="281" class="lbl" text-anchor="middle">action head g</text>
  <path d="M336,296 L336,326" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arwGrey)"/>
  <text x="336" y="346" class="lbl" text-anchor="middle">action a</text>
</svg>
